apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpldapadmin
  namespace: hr-app
  labels:
    app: phpldapadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpldapadmin
  template:
    metadata:
      labels:
        app: phpldapadmin
    spec:
      containers:
        - name: phpldapadmin
          image: phpldapadmin/phpldapadmin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app-env
              mountPath: /app/.env
              subPath: .env
              readOnly: true
            - name: corp-ca
              mountPath: /etc/ssl/corp
              readOnly: true
            - name: laravel-sessions
              mountPath: /app/storage/framework/sessions
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: app-env
          secret:
            secretName: phpldapadmin-env
        - name: corp-ca
          secret:
            secretName: ldap-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
        - name: laravel-sessions
          emptyDir: {}