apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpldapadmin
  namespace: hr-app
  labels:
    app: phpldapadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpldapadmin
  template:
    metadata:
      labels:
        app: phpldapadmin
    spec:
      hostAliases:
        - ip: "172.16.2.20"
          hostnames:
            - "dc01.corp.local"
      initContainers:
        - name: copy-ca-cert
          image: busybox:1.36
          command: ["sh", "-c", "cp /secret/ca.crt /certs/ca.crt && chmod 644 /certs/ca.crt"]
          volumeMounts:
            - name: corp-ca-secret
              mountPath: /secret
              readOnly: true
            - name: corp-ca-writable
              mountPath: /certs
      containers:
        - name: phpldapadmin
          image: osixia/phpldapadmin:0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PHPLDAPADMIN_HTTPS
              value: "false"
            - name: PHPLDAPADMIN_LDAP_CLIENT_TLS_REQCERT
              value: "demand"
            - name: PHPLDAPADMIN_LDAP_CLIENT_TLS_CA_CRT_FILENAME
              value: "ca.crt"
          volumeMounts:
            - name: pla-config
              mountPath: /container/environment/02-custom/env.yaml
              subPath: env.yaml
              readOnly: true
            - name: corp-ca-writable
              mountPath: /container/service/ldap-client/assets/certs/ca.crt
              subPath: ca.crt
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pla-config
          configMap:
            name: phpldapadmin-config
        - name: corp-ca-secret
          secret:
            secretName: ldap-ca-cert
        - name: corp-ca-writable
          emptyDir: {}